name: publish

# Publishing is a deliberate act, not a side effect of merging or of pressing
# a button.
#
# - `verify` needs no credentials and runs on pull requests that touch the
#   release surface, on manual dispatch, and on version tags. It runs the
#   quality gate, checks the packed tarball is usable, checks the release
#   preconditions, and does `npm stage publish --dry-run`.
# - `verify` ends with scripts/publish-gate.js, which decides whether this
#   run may publish: only a pushed tag `v<version>` of a commit on main, only
#   when the repository variable NPM_PUBLISH_VERSION equals that version,
#   never a version already on npm, and never the first version (published by
#   hand with 2FA). Manual dispatch and pull requests never publish.
# - `stage` runs only when the gate says so. It *stages* the exact tarball
#   `verify` built and checked (same shasum) with `npm stage publish`, through
#   npm Trusted Publishing (OIDC; no NPM_TOKEN exists to leak). Nothing is
#   installable until a maintainer approves the staged version with 2FA
#   (`npm stage approve`); an OIDC token cannot approve. The trusted publisher
#   on npm is stage-only (`--allow-stage-publish`), so a plain `npm publish`
#   from this workflow would be refused by the registry as well.
# - The npm CLI is pinned (NPM_CLI_VERSION) in both jobs: `npm stage` needs
#   11.15.0 or later, and the CLI that stages is the CLI that dry-ran.
#
# There is no `environment:` with required reviewers: on GitHub Free those are
# not available to private repositories, and a job naming an environment that
# does not exist creates it, unprotected — a gate that only looks like one.
# docs/releasing.md has the whole procedure and what this does not protect.
#
# Provenance is off: npm does not generate it for private source
# repositories. Enabling it belongs with making the repository public.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "package.json"
      - "scripts/**"

permissions: {}

env:
  NPM_CLI_VERSION: "11.19.1"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      shasum: ${{ steps.gate.outputs.shasum }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The gate checks the tagged commit is on main.
          fetch-depth: 0

      - name: Install toolchain
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.12
          install: true

      - name: Pin the npm CLI
        run: |
          mise exec -- npm install -g "npm@$NPM_CLI_VERSION"
          actual=$(mise exec -- npm --version)
          if [ "$actual" != "$NPM_CLI_VERSION" ]; then
            echo "::error::npm is $actual after installing $NPM_CLI_VERSION"
            exit 1
          fi
          # stage-publish.js runs npm as `node <npm-cli.js>`, no shell; name
          # the one just pinned rather than leaving it to PATH lookup.
          cli="$(mise exec -- npm root -g)/npm/bin/npm-cli.js"
          test -f "$cli" || { echo "::error::no npm-cli.js at $cli"; exit 1; }
          echo "NPM_CLI_JS=$cli" >> "$GITHUB_ENV"

      - name: Quality gate
        run: |
          mise exec -- npm ci
          mise exec -- npm run check
          mise exec -- npm run build
          node --check host/a8n-host.js
          node --check host/a8n-json.js

      - name: Release preconditions
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: mise exec -- node scripts/check-release.js "$TAG"

      # `npm pack` succeeding is not evidence the package is usable: install
      # the tarball into a clean project and drive the public API from it.
      - name: Verify the tarball is usable as published
        run: |
          mise exec -- node scripts/check-packed-package.js
          mise exec -- node scripts/check-public-api.js

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          mise exec -- npm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Publish gate
        id: gate
        env:
          NPM_PUBLISH_VERSION: ${{ vars.NPM_PUBLISH_VERSION }}
        run: mise exec -- node scripts/publish-gate.js "$RUNNER_TEMP"/package/*.tgz

      # For a published version the gate has already compared the tarball with
      # the registry's, and the registry would refuse it: nothing to rehearse.
      # (npm's own client-side "cannot publish over" check skips prerelease
      # versions, so it would not stop an alpha; the gate and the registry do.)
      - name: Stage (dry run)
        if: steps.gate.outputs.registry != 'present'
        env:
          EXPECTED_SHASUM: ${{ steps.gate.outputs.shasum }}
        run: mise exec -- node scripts/stage-publish.js "$RUNNER_TEMP"/package/*.tgz --expect-shasum "$EXPECTED_SHASUM" --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Trusted Publishing: the registry accepts this workflow's OIDC token
      # instead of a stored secret, for staging only.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.12
          install: true

      - name: Pin the npm CLI
        run: |
          mise exec -- npm install -g "npm@$NPM_CLI_VERSION"
          actual=$(mise exec -- npm --version)
          if [ "$actual" != "$NPM_CLI_VERSION" ]; then
            echo "::error::npm is $actual after installing $NPM_CLI_VERSION"
            exit 1
          fi
          # stage-publish.js runs npm as `node <npm-cli.js>`, no shell; name
          # the one just pinned rather than leaving it to PATH lookup.
          cli="$(mise exec -- npm root -g)/npm/bin/npm-cli.js"
          test -f "$cli" || { echo "::error::no npm-cli.js at $cli"; exit 1; }
          echo "NPM_CLI_JS=$cli" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Stage for approval (dist-tag next)
        id: stage
        env:
          EXPECTED_SHASUM: ${{ needs.verify.outputs.shasum }}
        run: mise exec -- node scripts/stage-publish.js "$RUNNER_TEMP"/package/*.tgz --expect-shasum "$EXPECTED_SHASUM"
