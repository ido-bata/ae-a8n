name: publish

# Publishing is a deliberate act, not a side effect of merging. It is triggered
# only by a version tag pushed by a human, and only after the same quality gate
# CI runs — so a broken package cannot reach the registry by accident.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for npm provenance: the registry attests the publish came from
      # this workflow at this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          # The host script ships verbatim, so a release has to come from the
          # real commit rather than a rebuilt artifact.
          persist-credentials: false

      - name: Require an npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not configured on this repository."
            echo "::error::Publishing is a release decision, so this is intentionally not wired to any default."
            exit 1
          fi

      - name: Install toolchain
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.12
          install: true

      - name: Quality gate
        run: |
          mise exec -- npm ci
          mise exec -- npm run check
          mise exec -- npm run build
          node --check host/a8n-host.js
          node --check host/a8n-json.js

      # `npm pack` succeeding is not evidence the package is usable. This
      # installs the tarball into a clean project and drives the public API, so
      # a missing host/ or a broken exports map fails here rather than in
      # somebody else's node_modules.
      - name: Verify the tarball is usable as published
        run: mise exec -- node scripts/check-packed-package.js

      - name: Confirm the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi
          echo "publishing $pkg_version"

      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        run: mise exec -- npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
